name: Supabase Keep-Alive

# Free-tier Supabase projects auto-pause after ~7 days of inactivity. This job
# issues a lightweight DB query every 3 days to reset that timer so the project
# stays warm (and the app's login/cloud-sync keeps working) even when the local
# dev machine is off.

on:
  schedule:
    - cron: '17 14 */3 * *' # every 3 days at 14:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/financial_data?select=user_id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase responded HTTP $code"
          # Any HTTP response (even 401 from RLS) means the DB was reached, which
          # resets the pause timer. Only a 000 (unreachable/paused) is a failure.
          if [ "$code" = "000" ]; then
            echo "::error::No response from Supabase — project may be paused or unreachable."
            exit 1
          fi
